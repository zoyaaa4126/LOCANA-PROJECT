<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locana | Rekomendasi Tempat Hangout di Bandung</title>

    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>

    <div class="container">

    <!-- LEFT -->
    <div class="left">
        <div class="login-box">

        <div class="logo">
            <img src="assets/img/Locana_Logo 1 (1).png" alt="gambar" class="logo-gambar">
            <h2>LOCANA</h2>
        </div>

        <div class="btn-login">
            <a href="login.html"><button class="active" id="masuk">Masuk</button></a>
            <a href="register.html"><button id="daftar">Daftar</button></a>
        </div>

        <h1>Waktunya <span class="highlight">Nongkrong!</h1></span>
        <p>Yuk lanjutkan perjalananmu menemukan tempat yang bikin nyaman.</p>
        <form id="loginForm">
            <div class="input-group">
            <label for="email">Email </label>
            <input type="email" name="email" id="email" required placeholder="Masukkan Email Disini">
            </div>

            <div class="input-group">
                <label for="password">Password </label>
            <input type="password" id="password" required placeholder="Masukkan Password Disini">
            <span class="material-symbols-outlined" id="togglePassword">visibility</span>
            </div>

            <div class="row">
                <label class="checkbox">
                <input type="checkbox">Ingat Saya</label>

                <a href="#" class="forgot">Lupa Password</a>
            </div>

            <button type="submit" id="submit" class="btn-submit">Masuk</button>
            <p id="error-msg"></p>

            <p class="register">Belum punya akun? 
                <a href="register.html">Daftar</a>
            </p>
        </form>

        </div>
    </div>

    <!-- RIGHT (CUMA SATU!) -->
    <div class="right">
        <div class="overlay">
            <span class="badge">
                <span class="material-symbols-outlined">verified</span>PILIHAN TERBAIK</span>
            <h2>Jelajahi Suasana<br>Otentik Braga.</h2>
            <div class="user-info">
                <div class="avatar-group">
                    <img src="assets/img/Gojo Satoru 🔵.jpg" alt="">
                    <img src="assets/img/❏ 𝐉𝐉𝐊 ، ᘡ ᐟ 𝘁𝗼𝗴𝗲 ⌕ ⁾⁾ ⨾  𝗶𝗰𝗼𝗻𝘀 ⤸♡° ╱╳╲.jpg" alt="">
                    <img src="assets/img/Kento Nanami.jpg" alt="">
                </div>
                <p>2.000+ Pengguna telah mereview tempat ini</p>
            </div>
        </div>
    </div>

    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
