<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locana | Rekomendasi Tempat Hangout di Bandung</title>

    <link rel="stylesheet" href="assets/css/register.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>

    <div class="container">

    <!-- LEFT -->
    <div class="left">
        <div class="login-box">

            <div class="logo">
                <img src="photo/Locana_Logo 1 (1).png" alt="gambar" class="logo-gambar">
                <h2>LOCANA</h2>
            </div>

            <div class="btn-login">
                <button class="active" id="masuk">Masuk</button>
                <button id="daftar">Daftar</button>
            </div>

            <h1>Mulai <span class="highlight">Cerita Kamu</span> di Sini</h1>
            <p>Dari ngopi santai sampai nongkrong malam, temukan tempat yang pas untuk setiap momenmu.</p>
            <form id="loginForm">
                <div class="input-group">
                <label for="email">Email </label>
                <input type="email" name="email" id="email" required placeholder="Masukkan Email Disini">
                </div>

                <div class="input-group">
                    <label for="password">Password </label>
                <input type="password" id="password" required placeholder="Masukkan Password Disini">
                <span class="material-symbols-outlined" id="togglePassword">visibility</span>
                </div>

                <label class="checkbox">
                    <input type="checkbox">Saya Menyetujui
                    <a href="#">syarat dan ketentuan</a>
                </label>

                <button type="submit" id="submit" class="btn-submit">Daftar</button>
                <p id="error-msg"></p>

                <p class="login">Sudah punya akun? 
                    <a href="login.html">Masuk</a>
                </p>
            </form>

        </div>
    </div>

    <!-- RIGHT (CUMA SATU!) -->
    <div class="right">
        <div class="overlay">
            <span class="badge">
                <span class="material-symbols-outlined">verified</span>PILIHAN TERBAIK</span>
            <div class="shadow-overlay"></div>
            <h2>Jelajahi Suasana<br>Otentik Braga.</h2>
            <div class="user-info">
                <div class="avatar-group">
                    <img src="photo/Gojo Satoru 🔵.jpg" alt="">
                    <img src="photo/❏ 𝐉𝐉𝐊 ، ᘡ ᐟ 𝘁𝗼𝗴𝗲 ⌕ ⁾⁾ ⨾  𝗶𝗰𝗼𝗻𝘀 ⤸♡° ╱╳╲.jpg" alt="">
                    <img src="photo/Kento Nanami.jpg" alt="">
                </div>
                <p>2.000+ Pengguna telah mereview tempat ini</p>
            </div>
        </div>
    </div>

    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
